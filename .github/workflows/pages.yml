# Nasadí webovú verziu (priečinok public/) do vetvy gh-pages pri každom pushi do main.
# GitHub Pages potom web servíruje z vetvy gh-pages.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verzia z package.json do webu
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/let v = 'web verzia';/let v = 'web v$VERSION';/" public/js/script.js
      - name: Nahrať public/ do vetvy gh-pages
        run: |
          cd public
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy web ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
